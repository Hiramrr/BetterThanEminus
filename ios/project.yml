name: BetterThanEminus
options:
  bundleIdPrefix: mx.hiram
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4993MQR6C9
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  BetterThanEminus:
    type: application
    platform: iOS
    sources:
      - path: BetterThanEminus
      # El código web se comparte con la extensión de Chrome: se copian las
      # carpetas tal cual (referencias de carpeta) al paquete de la app.
      - path: ../src
        type: folder
        buildPhase: resources
      - path: ../app
        type: folder
        buildPhase: resources
      - path: ../popup
        type: folder
        buildPhase: resources
      - path: web
        type: folder
        buildPhase: resources
      # ABC Areal: con licencia, fuera del repositorio (ver .gitignore).
      - path: fonts
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: BetterThanEminus/Info.plist
      properties:
        CFBundleDisplayName: Eminus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIViewControllerBasedStatusBarAppearance: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: Para elegir una foto de fondo o adjuntar imágenes a tus entregas.
        NSCameraUsageDescription: Para tomar una foto y adjuntarla a una entrega.
        NSUserNotificationsUsageDescription: Para avisarte antes de que venza una actividad.
        NSLocalNetworkUsageDescription: Sólo en desarrollo, para recargar el código desde la Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.hiram.BetterThanEminus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
